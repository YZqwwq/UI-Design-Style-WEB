<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览设计风格、探索界面语言，复制详细的 AI 设计提示词。">
  <title>设计图鉴 · Design Atlas</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="topbar">
        <a class="brand" href="/" aria-label="设计图鉴首页">设计图鉴</a>
        <label class="search"><input id="search" type="search" placeholder="搜索风格、颜色、关键词" aria-label="搜索设计" autocomplete="off"></label>
      </div>
      <nav id="categories" aria-label="设计分类"></nav>
      <div class="filter-row">
        <span class="filter-label">风格</span>
        <div id="tags" role="group" aria-label="风格标签"></div>
        <div class="filter-summary"><span id="count" role="status" aria-live="polite"></span><button id="reset" class="text-button" hidden>清除筛选</button></div>
      </div>
    </div>
  </header>
  <main>
    <section class="library" aria-label="设计库">
      <h1 id="collection-title" class="visually-hidden">全部设计</h1>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden><h2>没有符合条件的设计</h2><p>试试其他关键词，或清除筛选。</p><button id="empty-reset" class="primary">查看全部设计</button></div>
    </section>
  </main>
  <dialog id="detail" aria-labelledby="detail-title"><div class="detail-top"><span>DESIGN RECIPE / 设计配方</span><button id="close" class="icon-button" aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
