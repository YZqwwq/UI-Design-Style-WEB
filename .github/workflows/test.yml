name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Database tests
        run: |
          printf '%s\n' 'PGHOST=127.0.0.1' 'PGPORT=5432' 'PGDATABASE-test=atlas_test' 'PGUSER-test=postgres' 'PGPASSWORD-test=ci-only-password' 'PGSSLMODE=disable' > .env
          npm run db:migrate
          npm run test:db
          npm run test:auth:db
